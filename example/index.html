<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronRDP Web Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header bar */
        #header {
            background: #16213e;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }
        #header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e94560;
            margin-right: 16px;
        }
        #header input {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 13px;
            width: 140px;
        }
        #header input::placeholder { color: #666; }
        #header button {
            padding: 6px 16px;
            border-radius: 4px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        #connect-btn {
            background: #e94560;
            color: white;
        }
        #connect-btn:hover { background: #c73e54; }
        #connect-btn:disabled { background: #555; cursor: not-allowed; }
        #disconnect-btn {
            background: #533483;
            color: white;
        }
        #disconnect-btn:hover { background: #6b44a0; }
        #disconnect-btn:disabled { background: #333; cursor: not-allowed; }

        /* Status indicator */
        #status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }
        .status-disconnected { background: #4a1a1a; color: #f44336; }
        .status-connecting { background: #3a3a1a; color: #ffc107; }
        .status-connected { background: #1a472a; color: #4caf50; }

        /* Canvas area */
        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        #rdp-screen {
            display: block;
            background: #000;
            outline: none;
        }

        /* Log panel */
        #log-panel {
            background: #0d1117;
            border-top: 1px solid #0f3460;
            max-height: 180px;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.5;
            flex-shrink: 0;
        }
        .log-entry { white-space: pre-wrap; word-break: break-all; }
        .log-info { color: #8b949e; }
        .log-success { color: #3fb950; }
        .log-error { color: #f85149; }
        .log-warn { color: #d29922; }
        .log-time { color: #6e7681; margin-right: 6px; }

        /* Fullscreen button */
        #fullscreen-btn {
            background: transparent;
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        #fullscreen-btn:hover { background: #30363d; color: #e0e0e0; }

        /* File transfer panel */
        #file-transfer-panel {
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 12px 16px;
            display: none;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        #file-transfer-panel.visible { display: flex; }
        .ft-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ft-header h3 {
            font-size: 14px;
            color: #e94560;
            margin: 0;
        }
        .ft-actions {
            display: flex;
            gap: 8px;
        }
        .ft-btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: #533483;
            color: white;
        }
        .ft-btn:hover { background: #6b44a0; }
        .ft-btn:disabled { background: #555; cursor: not-allowed; }
        .ft-btn.primary { background: #e94560; }
        .ft-btn.primary:hover { background: #c73e54; }

        #file-list {
            max-height: 150px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid #0f3460;
            border-radius: 4px;
            padding: 8px;
        }
        .ft-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #21262d;
            font-size: 12px;
        }
        .ft-item:last-child { border-bottom: none; }
        .ft-item-name { flex: 1; color: #8b949e; }
        .ft-item-size { color: #6e7681; margin: 0 12px; }
        .ft-item-status { color: #3fb950; font-weight: 600; }
        .ft-item-status.downloading { color: #ffc107; }
        .ft-item-status.error { color: #f85149; }

        .ft-drop-zone {
            border: 2px dashed #0f3460;
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            color: #6e7681;
            font-size: 12px;
            transition: all 0.2s;
        }
        .ft-drop-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
            color: #e94560;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>IronRDP</h1>
        <input type="text" id="host" placeholder="Host" value="192.168.2.31:3389">
        <input type="text" id="username" placeholder="Username" value="zxd">
        <input type="password" id="password" placeholder="Password" value="zxd">
        <button id="connect-btn">Connect</button>
        <button id="disconnect-btn" disabled>Disconnect</button>
        <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
        <span id="status" class="status-disconnected">Disconnected</span>
    </div>

    <div id="canvas-container">
        <canvas id="rdp-screen" width="1280" height="720" tabindex="0"></canvas>
    </div>

    <div id="file-transfer-panel">
        <div class="ft-header">
            <h3>📁 File Transfer</h3>
            <div class="ft-actions">
                <button class="ft-btn" id="upload-btn" disabled>Upload Files</button>
                <button class="ft-btn primary" id="download-btn" disabled>Request Download</button>
                <input type="file" id="file-input" multiple style="display: none;">
            </div>
        </div>
        <div class="ft-drop-zone" id="drop-zone">
            Drag & drop files here to upload to remote desktop
        </div>
        <div id="file-list"></div>
    </div>

    <div id="log-panel"></div>

    <script type="module">
        // ── Import IronRDP WASM module ──
        import init, {
            setup,
            SessionBuilder,
            DesktopSize,
            InputTransaction,
            DeviceEvent,
            Extension,
            ClipboardData,
        } from '../pkg/rdp_client.js';

        // ── DOM Elements ──
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log-panel');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const hostInput = document.getElementById('host');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const canvas = document.getElementById('rdp-screen');
        const canvasContainer = document.getElementById('canvas-container');
        const fileTransferPanel = document.getElementById('file-transfer-panel');
        const uploadBtn = document.getElementById('upload-btn');
        const downloadBtn = document.getElementById('download-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileListEl = document.getElementById('file-list');

        let session = null;
        let wasmInitialized = false;
        let fileTransferEnabled = false;
        let clipboardReady = false;
        let pendingDownloads = new Map();
        let uploadQueue = [];
        let uploadedFiles = new Map();

        // ── Logging ──
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">${time}</span>${escapeHtml(message)}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function setStatus(text, state) {
            statusEl.textContent = text;
            statusEl.className = `status-${state}`;
        }

        // ── Scancode mapping (JS KeyboardEvent.code → PS/2 Set 1 scancode) ──
        // IronRDP expects PS/2 Set 1 scancodes (make codes).
        const SCANCODE_MAP = {
            'Escape': 0x01, 'Digit1': 0x02, 'Digit2': 0x03, 'Digit3': 0x04,
            'Digit4': 0x05, 'Digit5': 0x06, 'Digit6': 0x07, 'Digit7': 0x08,
            'Digit8': 0x09, 'Digit9': 0x0A, 'Digit0': 0x0B, 'Minus': 0x0C,
            'Equal': 0x0D, 'Backspace': 0x0E, 'Tab': 0x0F,
            'KeyQ': 0x10, 'KeyW': 0x11, 'KeyE': 0x12, 'KeyR': 0x13,
            'KeyT': 0x14, 'KeyY': 0x15, 'KeyU': 0x16, 'KeyI': 0x17,
            'KeyO': 0x18, 'KeyP': 0x19, 'BracketLeft': 0x1A, 'BracketRight': 0x1B,
            'Enter': 0x1C, 'ControlLeft': 0x1D,
            'KeyA': 0x1E, 'KeyS': 0x1F, 'KeyD': 0x20, 'KeyF': 0x21,
            'KeyG': 0x22, 'KeyH': 0x23, 'KeyJ': 0x24, 'KeyK': 0x25,
            'KeyL': 0x26, 'Semicolon': 0x27, 'Quote': 0x28, 'Backquote': 0x29,
            'ShiftLeft': 0x2A, 'Backslash': 0x2B,
            'KeyZ': 0x2C, 'KeyX': 0x2D, 'KeyC': 0x2E, 'KeyV': 0x2F,
            'KeyB': 0x30, 'KeyN': 0x31, 'KeyM': 0x32, 'Comma': 0x33,
            'Period': 0x34, 'Slash': 0x35, 'ShiftRight': 0x36,
            'NumpadMultiply': 0x37, 'AltLeft': 0x38, 'Space': 0x39,
            'CapsLock': 0x3A,
            'F1': 0x3B, 'F2': 0x3C, 'F3': 0x3D, 'F4': 0x3E,
            'F5': 0x3F, 'F6': 0x40, 'F7': 0x41, 'F8': 0x42,
            'F9': 0x43, 'F10': 0x44,
            'NumLock': 0x45, 'ScrollLock': 0x46,
            'Numpad7': 0x47, 'Numpad8': 0x48, 'Numpad9': 0x49,
            'NumpadSubtract': 0x4A, 'Numpad4': 0x4B, 'Numpad5': 0x4C,
            'Numpad6': 0x4D, 'NumpadAdd': 0x4E, 'Numpad1': 0x4F,
            'Numpad2': 0x50, 'Numpad3': 0x51, 'Numpad0': 0x52,
            'NumpadDecimal': 0x53,
            'F11': 0x57, 'F12': 0x58,
            'NumpadEnter': 0xE01C, 'ControlRight': 0xE01D,
            'NumpadDivide': 0xE035, 'PrintScreen': 0xE037,
            'AltRight': 0xE038, 'Home': 0xE047, 'ArrowUp': 0xE048,
            'PageUp': 0xE049, 'ArrowLeft': 0xE04B, 'ArrowRight': 0xE04D,
            'End': 0xE04F, 'ArrowDown': 0xE050, 'PageDown': 0xE051,
            'Insert': 0xE052, 'Delete': 0xE053,
            'MetaLeft': 0xE05B, 'MetaRight': 0xE05C, 'ContextMenu': 0xE05D,
            'Pause': 0xE11D45,
        };

        function getScancode(code) {
            return SCANCODE_MAP[code] ?? null;
        }

        // ── Input handling ──
        function setupInputHandlers() {
            // Prevent default browser behavior for most keys when canvas is focused
            canvas.addEventListener('keydown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!session) return;

                const scancode = getScancode(e.code);
                if (scancode === null) {
                    console.warn('Unknown key code:', e.code);
                    return;
                }

                try {
                    const event = DeviceEvent.keyPressed(scancode);
                    const tx = new InputTransaction();
                    tx.addEvent(event);
                    session.applyInputs(tx);
                } catch (err) {
                    console.error('Key press error:', err);
                }
            });

            canvas.addEventListener('keyup', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!session) return;

                const scancode = getScancode(e.code);
                if (scancode === null) return;

                try {
                    const event = DeviceEvent.keyReleased(scancode);
                    const tx = new InputTransaction();
                    tx.addEvent(event);
                    session.applyInputs(tx);
                } catch (err) {
                    console.error('Key release error:', err);
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!session) return;
                try {
                    const rect = canvas.getBoundingClientRect();
                    // Scale mouse coordinates to match the RDP desktop resolution
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const x = Math.round((e.clientX - rect.left) * scaleX);
                    const y = Math.round((e.clientY - rect.top) * scaleY);

                    const event = DeviceEvent.mouseMove(x, y);
                    const tx = new InputTransaction();
                    tx.addEvent(event);
                    session.applyInputs(tx);
                } catch (err) {
                    // Suppress frequent mouse errors
                }
            });

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                canvas.focus();
                if (!session) return;
                try {
                    const event = DeviceEvent.mouseButtonPressed(e.button);
                    const tx = new InputTransaction();
                    tx.addEvent(event);
                    session.applyInputs(tx);
                } catch (err) {
                    console.error('Mouse down error:', err);
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                e.preventDefault();
                if (!session) return;
                try {
                    const event = DeviceEvent.mouseButtonReleased(e.button);
                    const tx = new InputTransaction();
                    tx.addEvent(event);
                    session.applyInputs(tx);
                } catch (err) {
                    console.error('Mouse up error:', err);
                }
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (!session) return;
                try {
                    // vertical=true for Y axis scroll, false for X axis
                    if (e.deltaY !== 0) {
                        const amount = e.deltaY > 0 ? -1 : 1;
                        const event = DeviceEvent.wheelRotations(true, amount, 1); // 1 = Line unit
                        const tx = new InputTransaction();
                        tx.addEvent(event);
                        session.applyInputs(tx);
                    }
                    if (e.deltaX !== 0) {
                        const amount = e.deltaX > 0 ? -1 : 1;
                        const event = DeviceEvent.wheelRotations(false, amount, 1);
                        const tx = new InputTransaction();
                        tx.addEvent(event);
                        session.applyInputs(tx);
                    }
                } catch (err) {
                    console.error('Wheel error:', err);
                }
            }, { passive: false });

            // Prevent context menu on right-click
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            log('Input handlers configured (keyboard, mouse, wheel)', 'success');
        }

        // ── Format IronError ──
        function formatError(e) {
            if (e && typeof e === 'object' && '__wbg_ptr' in e) {
                try {
                    const kindNames = {
                        0: 'General', 1: 'WrongPassword', 2: 'LogonFailure',
                        3: 'AccessDenied', 4: 'RDCleanPath', 5: 'ProxyConnect',
                        6: 'NegotiationFailure',
                    };
                    const kind = e.kind ? e.kind() : 'Unknown';
                    const bt = e.backtrace ? e.backtrace() : '';
                    return `[${kindNames[kind] || kind}] ${bt}`;
                } catch (_) {}
            }
            return e?.message || e?.toString() || String(e);
        }

        // ── File Transfer ──
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function addFileToList(name, size, status = 'queued') {
            const item = document.createElement('div');
            item.className = 'ft-item';
            item.innerHTML = `
                <span class="ft-item-name">${escapeHtml(name)}</span>
                <span class="ft-item-size">${formatFileSize(size)}</span>
                <span class="ft-item-status">${status}</span>
            `;
            fileListEl.appendChild(item);
            fileListEl.scrollTop = fileListEl.scrollHeight;
            return item;
        }

        function updateFileStatus(itemEl, status, isError = false) {
            const statusEl = itemEl.querySelector('.ft-item-status');
            statusEl.textContent = status;
            statusEl.className = 'ft-item-status' + (isError ? ' error' : status === 'downloading' ? ' downloading' : '');
        }

        function setupFileTransferCallbacks(builder) {
            fileTransferEnabled = true;

            // Register file transfer callback extensions at build time
            const filesAvailableCallback = new Extension('files_available_callback', (files, clipDataId) => {
                log(`Remote clipboard has ${files.length} file(s) available`, 'success');
                pendingDownloads = new Map(files.map((f, i) => [i, f]));
                downloadBtn.disabled = false;

                files.forEach((fileInfo, index) => {
                    addFileToList(fileInfo.name || `file_${index}`, fileInfo.fileSize || 0, 'available');
                });
            });
            builder.extension(filesAvailableCallback);

            const fileContentsRequestCallback = new Extension('file_contents_request_callback', async (request) => {
                log(`Remote requesting file contents: streamId=${request.streamId}, index=${request.index}, flags=${request.flags}`, 'info');

                const file = uploadedFiles.get(request.index);
                if (!file) {
                    log(`File not found for index=${request.index}`, 'error');
                    session.invokeExtension(new Extension('submit_file_contents', {
                        stream_id: request.streamId,
                        is_error: true,
                        data: new Uint8Array(0),
                    }));
                    return;
                }

                try {
                    if (request.flags & 0x00000001) {
                        // FILECONTENTS_SIZE - return 8-byte little-endian u64 file size
                        const sizeBytes = new Uint8Array(8);
                        const view = new DataView(sizeBytes.buffer);
                        view.setBigUint64(0, BigInt(file.size), true);
                        log(`Sending file size: ${file.size} bytes`, 'info');
                        session.invokeExtension(new Extension('submit_file_contents', {
                            stream_id: request.streamId,
                            is_error: false,
                            data: sizeBytes,
                        }));
                    } else if (request.flags & 0x00000002) {
                        // FILECONTENTS_DATA - return file content range
                        const start = request.position;
                        const length = request.size;
                        const blob = file.slice(start, start + length);
                        const buffer = await blob.arrayBuffer();
                        const data = new Uint8Array(buffer);
                        log(`Sending file data: ${data.length} bytes (offset=${start})`, 'info');
                        session.invokeExtension(new Extension('submit_file_contents', {
                            stream_id: request.streamId,
                            is_error: false,
                            data: data,
                        }));
                    }
                } catch (e) {
                    log(`Failed to read file: ${formatError(e)}`, 'error');
                    session.invokeExtension(new Extension('submit_file_contents', {
                        stream_id: request.streamId,
                        is_error: true,
                        data: new Uint8Array(0),
                    }));
                }
            });
            builder.extension(fileContentsRequestCallback);

            const fileContentsResponseCallback = new Extension('file_contents_response_callback', (response) => {
                log(`File contents response: streamId=${response.streamId}, size=${response.data.length}`, 'info');
                // Handle file content responses
            });
            builder.extension(fileContentsResponseCallback);

            const lockCallback = new Extension('lock_callback', (dataId) => {
                log(`Clipboard locked: dataId=${dataId}`, 'info');
            });
            builder.extension(lockCallback);

            const unlockCallback = new Extension('unlock_callback', (dataId) => {
                log(`Clipboard unlocked: dataId=${dataId}`, 'info');
            });
            builder.extension(unlockCallback);

            const locksExpiredCallback = new Extension('locks_expired_callback', (clipDataIds) => {
                log(`Clipboard locks expired: ${clipDataIds.length} lock(s)`, 'warn');
            });
            builder.extension(locksExpiredCallback);

            log('File transfer callbacks registered (via CLIPRDR channel)', 'success');
        }

        function setupFileTransferUI() {
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFilesUpload(Array.from(e.target.files));
                }
            });

            downloadBtn.addEventListener('click', () => {
                handleFileDownload();
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFilesUpload(Array.from(e.dataTransfer.files));
                }
            });
        }

        async function handleFilesUpload(files) {
            if (!session || !fileTransferEnabled) {
                log('File transfer not available', 'error');
                return;
            }

            if (!clipboardReady) {
                log('Waiting for clipboard channel to be ready...', 'info');
                await new Promise(resolve => {
                    const checkReady = () => {
                        if (clipboardReady) {
                            resolve();
                        } else {
                            setTimeout(checkReady, 200);
                        }
                    };
                    checkReady();
                });
                log('Clipboard channel ready', 'success');
            }

            log(`Uploading ${files.length} file(s) to remote desktop...`);

            try {
                const fileDescriptors = files.map((file, index) => {
                    uploadedFiles.set(index, file);
                    return {
                        name: file.name,
                        size: file.size,
                        lastModified: file.lastModified,
                    };
                });

                const initiateFileCopyExt = new Extension('initiate_file_copy', fileDescriptors);
                session.invokeExtension(initiateFileCopyExt);

                log(`Initiated file copy for ${files.length} file(s)`, 'success');

                files.forEach((file, index) => {
                    const itemEl = addFileToList(file.name, file.size, 'uploading');
                    updateFileStatus(itemEl, 'uploaded');
                    log(`✓ Prepared ${file.name} for upload`, 'success');
                });
            } catch (err) {
                const errorMsg = formatError(err);
                log(`✗ Failed to initiate file copy: ${errorMsg}`, 'error');
                console.error('Upload error details:', err);
            }
        }

        function handleFileDownload() {
            if (!session || !fileTransferEnabled) {
                log('File transfer not available', 'error');
                return;
            }

            if (pendingDownloads.size === 0) {
                log('No files available for download. Files will appear when remote clipboard has content.', 'info');
                return;
            }

            log(`Requesting ${pendingDownloads.size} file(s) from remote desktop...`, 'info');

            pendingDownloads.forEach((fileInfo, index) => {
                const itemEl = addFileToList(fileInfo.name || `file_${index}`, fileInfo.fileSize || 0, 'downloading');

                try {
                    const requestFileContentsExt = new Extension('request_file_contents', {
                        stream_id: index + 1,
                        file_index: index,
                        flags: 0x00000002,
                        position: 0,
                        size: fileInfo.fileSize || 0,
                    });

                    session.invokeExtension(requestFileContentsExt);
                    log(`Requested file: ${fileInfo.name || `file_${index}`}`, 'info');
                } catch (err) {
                    updateFileStatus(itemEl, 'failed', true);
                    const errorMsg = formatError(err);
                    log(`✗ Failed to request ${fileInfo.name || `file_${index}`}: ${errorMsg}`, 'error');
                    console.error('Download error details:', err);
                }
            });
        }

        // ── Connect ──
        async function connect() {
            try {
                const destination = hostInput.value || '192.168.2.31:3389';
                const username = usernameInput.value || 'zxd';
                const password = passwordInput.value || 'zxd';

                // Proxy runs on the same origin (same host & port)
                const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const proxyAddress = `${wsProtocol}//${location.host}`;

                if (!wasmInitialized) {
                    log('Loading IronRDP WebAssembly module...');
                    await init();
                    setup('info');
                    wasmInitialized = true;
                    log('WASM module initialized', 'success');
                }

                setStatus('Connecting...', 'connecting');
                connectBtn.disabled = true;

                log(`Connecting to ${destination} via proxy ${proxyAddress}`);
                log(`User: ${username}`);

                const desktopSize = new DesktopSize(1280, 720);

                // Disable CredSSP since we don't have a Kerberos/NTLM implementation in WASM
                const enableCredsspExt = new Extension('enable_credssp', true);

                const builder = new SessionBuilder();
                builder.username(username);
                builder.password(password);
                builder.destination(destination);
                builder.proxyAddress(proxyAddress);
                builder.authToken('none');
                builder.desktopSize(desktopSize);
                builder.renderCanvas(canvas);
                builder.extension(enableCredsspExt);

                setupFileTransferCallbacks(builder);

                // Register clipboard callbacks (required for CLIPRDR channel to be enabled)
                builder.remoteClipboardChangedCallback((clipboardData) => {
                    clipboardReady = true;
                    try {
                        if (clipboardData.isEmpty()) {
                            log('Remote clipboard cleared', 'info');
                            return;
                        }
                        const items = clipboardData.items();
                        const mimeTypes = items.map(item => item.mimeType()).join(', ');
                        log(`Remote clipboard changed: ${mimeTypes}`, 'info');
                    } catch (e) {
                        log(`Clipboard error: ${formatError(e)}`, 'error');
                    }
                });

                builder.forceClipboardUpdateCallback(async () => {
                    if (clipboardReady) {
                        // Already initialized, skip
                        return;
                    }
                    clipboardReady = true;
                    log('Clipboard channel ready (CLIPRDR initialized)', 'success');
                    // Sync local clipboard to remote to complete channel initialization
                    try {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            const data = new ClipboardData();
                            data.addText('text/plain', text);
                            await session.onClipboardPaste(data);
                            log('Local clipboard synced to remote', 'info');
                        } else {
                            // Send empty clipboard to trigger initiate_copy and transition to Ready state
                            const data = new ClipboardData();
                            await session.onClipboardPaste(data);
                        }
                    } catch (e) {
                        // Clipboard read may fail due to permissions, send empty clipboard anyway
                        log(`Clipboard read failed, sending empty clipboard: ${formatError(e)}`, 'info');
                        const data = new ClipboardData();
                        await session.onClipboardPaste(data);
                    }
                });

                builder.setCursorStyleCallbackContext(canvas);
                builder.setCursorStyleCallback(function(style) {
                    canvas.style.cursor = style || 'default';
                });

                log('Initiating RDP connection...');
                session = await builder.connect();

                const ds = session.desktopSize();
                log(`Connected! Desktop: ${ds.width}x${ds.height}`, 'success');
                canvas.width = ds.width;
                canvas.height = ds.height;

                setStatus(`Connected (${ds.width}×${ds.height})`, 'connected');
                disconnectBtn.disabled = false;
                canvas.focus();

                if (fileTransferEnabled) {
                    fileTransferPanel.classList.add('visible');
                    uploadBtn.disabled = false;
                    log('File transfer panel enabled', 'success');
                }

                // Run the session event loop
                session.run().then((info) => {
                    log(`Session ended: ${info.reason()}`, 'warn');
                    cleanup();
                }).catch((e) => {
                    log(`Session error: ${formatError(e)}`, 'error');
                    cleanup();
                });

            } catch (e) {
                log(`Connection failed: ${formatError(e)}`, 'error');
                cleanup();
            }
        }

        function cleanup() {
            session = null;
            clipboardReady = false;
            uploadedFiles.clear();
            setStatus('Disconnected', 'disconnected');
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            fileTransferPanel.classList.remove('visible');
            uploadBtn.disabled = true;
            downloadBtn.disabled = true;
            fileListEl.innerHTML = '';
            pendingDownloads.clear();
            uploadQueue = [];
        }

        function disconnect() {
            if (session) {
                try {
                    session.shutdown();
                    log('Disconnected by user', 'warn');
                } catch (e) {
                    log(`Disconnect error: ${formatError(e)}`, 'error');
                }
            }
            cleanup();
        }

        // ── Fullscreen ──
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                canvasContainer.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        // ── Wire up buttons ──
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);

        // Allow Enter to connect
        [hostInput, usernameInput, passwordInput].forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !connectBtn.disabled) connect();
            });
        });

        // ── Initialize ──
        setupInputHandlers();
        setupFileTransferUI();
        log('IronRDP Web Client ready. Click Connect to start.');
        log('File transfer support will be enabled after connecting if server supports it.', 'info');
    </script>
</body>
</html>
