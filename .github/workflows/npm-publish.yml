name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is REQUIRED for trusted publishing (and provenance) to work:
# npm exchanges the GitHub OIDC token for a short-lived publish credential, so
# no NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

# Never let two publishes race for the same version. A queued run re-checks the
# registry after the first one finishes, finds the version published, and skips.
concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  # Pinned on purpose: the published wasm has to stay reproducible, so the
  # toolchain is the one this package is known to build with (same versions as a
  # working local build), not whatever `stable` happens to be on the day.
  RUST_VERSION: '1.99.1'
  WASM_PACK_VERSION: '0.15.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    # `[skip ci]` is already honoured natively by GitHub Actions; `[skip npm]`
    # lets a commit run the other workflows but skip this one. Because `publish`
    # needs this job, skipping here skips the whole workflow.
    if: ${{ !contains(github.event.head_commit.message, '[skip npm]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Check whether this version is already published
        id: version
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          echo "package.json says $pkg@$ver"

          # `npm view <pkg>@<ver> version` exits 0 when the version exists and
          # exits 1 with E404 when it does not.
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$pkg@$ver is not published yet — will build and publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.publish }}" = "true" ]; then
            echo "### New version to publish :rocket:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Already published — skipping build and publish :white_check_mark:" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # A cold wasm release build of the whole IronRDP dependency tree takes a few
    # minutes; the cached path is much shorter. This is only a runaway guard.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
          node-version: '24'
          # NO `registry-url` on purpose. With it, setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc and
          # exports NODE_AUTH_TOKEN as the placeholder `XXXXX-XXXXX-...`. npm then
          # takes the token path, rejects the placeholder and fails with ENEEDAUTH
          # *instead of* doing the OIDC trusted-publishing exchange. The default
          # registry is npmjs anyway, so leaving it out is what makes OIDC work.

      # No `npm ci` here on purpose: the package has no dependencies of its own
      # (bin/build.js only uses node builtins), and package-lock.json is out of
      # sync with package.json — an install would only add a way to fail.

      - name: Install Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Install wasm-pack
        run: |
          set -eu
          dir="wasm-pack-v$WASM_PACK_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL \
            "https://github.com/rustwasm/wasm-pack/releases/download/v$WASM_PACK_VERSION/$dir.tar.gz" \
            | tar xz
          # Put it next to rustup's shims, which is already on PATH.
          install "$dir/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version

      # The patched IronRDP checkout is recreated from scratch whenever the
      # pinned revision or a patch changes (see bin/prepare-ironrdp.js), so a
      # restored-but-stale cache is self-healing: it just gets rebuilt.
      - name: Cache IronRDP checkout
        uses: actions/cache@v4
        with:
          path: .ironrdp
          key: ironrdp-${{ hashFiles('bin/prepare-ironrdp.js', 'patches/**') }}

      - name: Prepare IronRDP checkout
        run: node bin/prepare-ironrdp.js

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .build/target
            # wasm-pack compiles wasm-bindgen-cli from source (~2 min) and
            # downloads wasm-opt (binaryen) on the first build of a version.
            ~/.cache/.wasm-pack
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'src/**', 'bin/prepare-ironrdp.js', 'patches/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -eu
          for f in pkg/rdp_client.js pkg/rdp_client.d.ts pkg/rdp_client_bg.wasm; do
            [ -s "$f" ] || { echo "missing or empty build artifact: $f"; exit 1; }
          done
          # `pkg/` is gitignored but whitelisted via the `files` field of
          # package.json — show what would actually ship.
          npm pack --dry-run

      - name: Check OIDC availability
        # Trusted publishing cannot work without the OIDC request URL. Fail here
        # with a readable message instead of a bare ENEEDAUTH from npm.
        run: |
          set -eu
          echo "npm $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is missing — is 'permissions: id-token: write' still set?"
            exit 1
          fi
          # A token in .npmrc makes npm take the token path instead of the OIDC
          # exchange. Values are never printed, just the fact that one exists.
          if [ -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ] &&
             grep -q "_authToken" "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; then
            echo "::warning::.npmrc has an _authToken entry — npm may ignore OIDC because of it"
          fi

      - name: Publish
        # `npm publish` itself performs the OIDC exchange (npm >= 11.5.1) and
        # attaches provenance. Re-check the registry first: the version may have
        # appeared between the `check` job and now.
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver appeared on npm in the meantime — nothing to publish."
            exit 0
          fi
          npm publish --access public --provenance
