[package]
name = "rdp-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM dependencies
wasm-bindgen = "0.2"
# Pinned on purpose: the published wasm has to be reproducible, and the build
# actually runs against a patched local checkout of this revision (see
# bin/prepare-ironrdp.js and patches/). This line is what a plain
# `cargo build` without the build script would use.
ironrdp-web = { git = "https://github.com/Devolutions/IronRDP.git", rev = "da016ce860040c6cb37943cfc857d836735d252c" }
web-sys = { version = "0.3", features = ["console"] }